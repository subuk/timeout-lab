server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tmlab.krglv.com;
    root /var/www/tmlab;
    index index.html;

    # Cloudflare terminates public TLS; support both HTTP and HTTPS to origin.
    ssl_certificate /etc/letsencrypt/live/krglv.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/krglv.com/privkey.pem;

    access_log /var/log/nginx/tmlab.access.log;
    error_log /var/log/nginx/tmlab.error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Assets have stable names: revalidate after deployments.
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript text/css application/wasm;

    # Public agent instructions must be readable as text by URL-fetching tools.
    location = /skill.md {
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
    location ~ /\. {
        deny all;
    }
}
